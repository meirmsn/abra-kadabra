# Plain CI (D-06): deterministic checks only, no LLM jobs. Two tiers (spec specs/ci-fast-slow-tiers.md),
# the shape of runtime/templates/ci.yml; both jobs are the required checks on main. Never give
# either a job-level `if` or `continue-on-error`: GitHub counts a skipped required job as passed.
#   fast: scripts/check-fast.sh: secret scan, lint, and every test not marked slow.
#   slow: scripts/check-slow.sh: the end-to-end tests (the whole install); runs only after fast passes.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release's checksums file.
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  SHELLCHECK_VERSION: 0.11.0
  # sha256 of shellcheck-v0.11.0.linux.x86_64.tar.xz; the release publishes no checksums, so this is
  # the hash of the asset as downloaded on 2026-10-12 (W10.4.2): it pins that exact file.
  SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
  DCG_VERSION: 0.14.4
  # sha256 of dcg-x86_64-unknown-linux-musl.tar.xz, from the release's SHA256SUMS file.
  DCG_SHA256: 09daf765e21457a756e69cc9f8bce41635836c6b958f5b27c7a6a6a376cbde21

jobs:
  fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0 # the secret scan and the commit-identity check read the commits since the base
          persist-credentials: false

      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Install shellcheck (pinned, checksum-verified)
        run: |
          set -euo pipefail
          tarball="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSLo "$RUNNER_TEMP/$tarball" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/$tarball"
          echo "$SHELLCHECK_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # For tests/pre-bash.test.sh: the devshop's Bash guard runs the real dcg.
      - name: Install dcg (pinned, checksum-verified)
        run: |
          set -euo pipefail
          tarball="dcg-x86_64-unknown-linux-musl.tar.xz"
          curl -fsSLo "$RUNNER_TEMP/$tarball" \
            "https://github.com/Dicklesworthstone/destructive_command_guard/releases/download/v${DCG_VERSION}/$tarball"
          echo "$DCG_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" dcg
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # PyYAML for runtime/scripts/ci-tiers-check.py, hash-pinned, in a venv first on PATH.
      - name: Install pinned Python packages
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --require-hashes --only-binary=:all: -r .github/requirements-ci.txt
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      # Prettier at the version package.json pins, integrity-checked against package-lock.json.
      - name: Install pinned Node tools
        run: npm ci --ignore-scripts --no-audit --no-fund

      # Three fast tests sandbox themselves with `unshare` (a private mount namespace and scratch
      # /opt); Ubuntu 24.04 blocks unprivileged user namespaces through AppArmor by default.
      - name: Allow user namespaces (for the sandboxed tests)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Fast tier (secret scan, lint, every test not marked slow)
        env:
          # PR: everything since the base; push to main: everything since the previous tip.
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: scripts/check-fast.sh "$BASE"

  slow:
    needs: fast
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0 # tests/bootstrap.test.sh pins a commit from before the runtime move
          persist-credentials: false

      # tests/bootstrap.test.sh replays the cloud setup in a private mount namespace with a scratch
      # /opt, as above.
      - name: Allow user namespaces (for the install scenario test)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # The install test reads the plugin's JSON with jq, which the runner image ships; say so here
      # if an image ever drops it, rather than deep in the test.
      - name: Check jq (from the runner image)
        run: command -v jq

      - name: Slow tier (the install, end to end)
        run: scripts/check-slow.sh
