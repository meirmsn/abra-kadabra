# Plain CI (D-06): deterministic checks only, no LLM jobs. Both jobs are meant as required checks on main.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release's checksums file.
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  SHELLCHECK_VERSION: 0.11.0
  # sha256 of shellcheck-v0.11.0.linux.x86_64.tar.xz; the release publishes no checksums, so this is
  # the hash of the asset as downloaded on 2026-10-12 (W10.4.2): it pins that exact file.
  SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198

jobs:
  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Install shellcheck (pinned, checksum-verified)
        run: |
          set -euo pipefail
          tarball="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSLo "$RUNNER_TEMP/$tarball" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/$tarball"
          echo "$SHELLCHECK_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # Prettier at the version package.json pins, integrity-checked against package-lock.json.
      - name: Install pinned Node tools
        run: npm ci --ignore-scripts --no-audit --no-fund

      # tests/bootstrap.test.sh replays the cloud setup in a private mount namespace with a scratch
      # /opt; Ubuntu 24.04 blocks unprivileged user namespaces through AppArmor by default.
      - name: Allow user namespaces (for the install scenario test)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Tests (incl. the config catching planted secrets and each lint check failing on bad input)
        run: tests/run.sh

      - name: Secret scan (the commits this change adds, then the tree)
        env:
          # PR: everything since the base; push to main: everything since the previous tip.
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: scripts/secret-scan.sh "$BASE"

  # The repo's own lint. Each check is a script in scripts/, proven by the test of the same name
  # (run in the job above). A missing tool fails the check, never passes it.
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install shellcheck (pinned, checksum-verified)
        run: |
          set -euo pipefail
          tarball="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSLo "$RUNNER_TEMP/$tarball" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/$tarball"
          echo "$SHELLCHECK_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # Prettier at the version package.json pins, integrity-checked against package-lock.json.
      - name: Install pinned Node tools
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Formatting (pinned prettier --check)
        if: ${{ !cancelled() }}
        run: scripts/format-check.sh

      - name: Shell scripts (shellcheck)
        if: ${{ !cancelled() }}
        run: scripts/shellcheck.sh

      - name: Docs map (every doc reachable, no broken links)
        if: ${{ !cancelled() }}
        run: scripts/docs-map-check.py

      - name: No commits under a test identity (L-41)
        if: ${{ !cancelled() }}
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: scripts/commit-identity-check.sh "$BASE"
