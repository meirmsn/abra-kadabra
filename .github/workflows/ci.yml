# Plain CI (D-06): deterministic checks only, no LLM jobs. Two tiers (spec specs/ci-fast-slow-tiers.md),
# the shape of runtime/templates/ci.yml; both jobs are the required checks on main. Never give
# either a job-level `if` or `continue-on-error`: GitHub counts a skipped required job as passed.
#   fast: scripts/check-fast.sh: secret scan, lint, and every test not marked slow.
#   slow: scripts/check-slow.sh: the end-to-end tests (the whole install, the UI render check); runs only after fast passes.
# On main, the merged PR's deploy comment follows its merge (specs/devshop-deploy-comment.md):
# `announce` (Merged), `deploy` after both tiers (Checking on `main`, then On `main`, ships in the
# next release: a release tag ships it), `report` (a final state whatever happened); the template's
# jobs, with runtime/scripts/deploy-comment.mjs.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release's checksums file.
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  SHELLCHECK_VERSION: 0.11.0
  # sha256 of shellcheck-v0.11.0.linux.x86_64.tar.xz; the release publishes no checksums, so this is
  # the hash of the asset as downloaded on 2026-10-12 (W10.4.2): it pins that exact file.
  SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
  DCG_VERSION: 0.14.4
  # sha256 of dcg-x86_64-unknown-linux-musl.tar.xz, from the release's SHA256SUMS file.
  DCG_SHA256: 09daf765e21457a756e69cc9f8bce41635836c6b958f5b27c7a6a6a376cbde21

jobs:
  fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0 # the secret scan and the commit-identity check read the commits since the base
          persist-credentials: false

      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Install shellcheck (pinned, checksum-verified)
        run: |
          set -euo pipefail
          tarball="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSLo "$RUNNER_TEMP/$tarball" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/$tarball"
          echo "$SHELLCHECK_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # For tests/pre-bash.test.sh: the devshop's Bash guard runs the real dcg.
      - name: Install dcg (pinned, checksum-verified)
        run: |
          set -euo pipefail
          tarball="dcg-x86_64-unknown-linux-musl.tar.xz"
          curl -fsSLo "$RUNNER_TEMP/$tarball" \
            "https://github.com/Dicklesworthstone/destructive_command_guard/releases/download/v${DCG_VERSION}/$tarball"
          echo "$DCG_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" dcg
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # PyYAML for runtime/scripts/ci-tiers-check.py, hash-pinned, in a venv first on PATH.
      - name: Install pinned Python packages
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --require-hashes --only-binary=:all: -r .github/requirements-ci.txt
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      # Prettier at the version package.json pins, integrity-checked against package-lock.json.
      - name: Install pinned Node tools
        run: npm ci --ignore-scripts --no-audit --no-fund

      # Three fast tests sandbox themselves with `unshare` (a private mount namespace and scratch
      # /opt); Ubuntu 24.04 blocks unprivileged user namespaces through AppArmor by default.
      - name: Allow user namespaces (for the sandboxed tests)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # The PR's title, or on a push the head commit's subject (the squash merge makes it from the
      # title), starts with a Conventional Commit type: scripts/release.py computes the next version
      # from them (spec specs/devshop-releases.md). Passed through env, never interpolated into the script.
      - name: PR title (a Conventional Commit type)
        env:
          TITLE: ${{ github.event.pull_request.title || github.event.head_commit.message }}
        run: scripts/pr-title-check.py "$(head -n 1 <<<"$TITLE")"

      - name: Fast tier (secret scan, lint, every test not marked slow)
        env:
          # PR: everything since the base; push to main: everything since the previous tip.
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: scripts/check-fast.sh "$BASE"

  slow:
    needs: fast
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0 # tests/bootstrap.test.sh pins a commit from before the runtime move
          persist-credentials: false

      # tests/bootstrap.test.sh replays the cloud setup in a private mount namespace with a scratch
      # /opt, as above.
      - name: Allow user namespaces (for the install scenario test)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # The install test reads the plugin's JSON with jq, which the runner image ships; say so here
      # if an image ever drops it, rather than deep in the test.
      - name: Check jq (from the runner image)
        run: command -v jq

      # Playwright at the version package.json pins, and that version's Chromium, for
      # tests/ui-render-check.test.sh (the UI baseline's render check in a real browser).
      - name: Install pinned Node tools and Chromium
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Slow tier (the install and the render check, end to end)
        run: scripts/check-slow.sh

  # Comments "Merged" on the merged PR as soon as the run on main starts (its deploy comment).
  announce:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write # the deploy comment
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Tell the merged PR it merged
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node runtime/scripts/deploy-comment.mjs merged

  # The devshop's release: main only, after both tiers passed on this commit. Nothing is deployed:
  # scripts/deploy.sh writes what the comment reads (the commit, the previous tip, its page, how to
  # undo), so no environment, secret or setup.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [fast, slow]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write # the deploy comment
    concurrency:
      group: production
      cancel-in-progress: false
    outputs: # for `report`, when this job's own comment step couldn't write
      url: ${{ steps.deploy.outputs.url }}
      version: ${{ steps.deploy.outputs.version }}
      previous_version: ${{ steps.deploy.outputs.previous_version }}
      rollback: ${{ steps.deploy.outputs.rollback }}
      site_url: ${{ steps.deploy.outputs.site_url }}
      site_smoke: ${{ steps.deploy.outputs.site_smoke }}
      none: ${{ steps.deploy.outputs.none }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      # The comment reports the deploy, it is not part of it: a comment GitHub refuses or a slow API
      # shows as a failed step but never fails or holds up the deploy. No deploy secret in its env.
      - name: Tell the merged PR it is deploying
        continue-on-error: true
        timeout-minutes: 1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DEPLOYING_AS: Checking on `main`
        run: node runtime/scripts/deploy-comment.mjs deploying

      - name: Release (scripts/deploy.sh writes what the comment reads; nothing is deployed)
        id: deploy
        env:
          BUILD_SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
        run: scripts/deploy.sh

      - name: Tell the merged PR it is live
        continue-on-error: true
        timeout-minutes: 1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          URL: ${{ steps.deploy.outputs.url }}
          VERSION: ${{ steps.deploy.outputs.version }}
          PREVIOUS: ${{ steps.deploy.outputs.previous_version }}
          ROLLBACK: ${{ steps.deploy.outputs.rollback }}
          SITE_URL: ${{ steps.deploy.outputs.site_url }}
          SITE_SMOKE: ${{ steps.deploy.outputs.site_smoke }}
          NONE: ${{ steps.deploy.outputs.none }}
          LIVE_AS: On `main`, ships in the next release
        run: node runtime/scripts/deploy-comment.mjs deployed

      - name: Tell the merged PR the deploy failed
        if: failure() || cancelled()
        continue-on-error: true
        timeout-minutes: 1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PREVIOUS: ${{ steps.deploy.outputs.previous_version }}
          ROLLBACK: ${{ steps.deploy.outputs.rollback }}
          DEPLOYED: ${{ steps.deploy.outputs.deployed }}
          SITE_URL: ${{ steps.deploy.outputs.site_url }}
          SITE_SMOKE: ${{ steps.deploy.outputs.site_smoke }}
        run: node runtime/scripts/deploy-comment.mjs failed

  # Ends the deploy comment in a final state whatever happened: checks failed or cancelled on main, the
  # deploy superseded by a newer merge's, cancelled, or this job's own comment write lost.
  report:
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [fast, slow, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write # the deploy comment
      actions: read # to find a newer run on main
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: End the merged PR's deploy comment in a final state
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAST: ${{ needs.fast.result }}
          SLOW: ${{ needs.slow.result }}
          DEPLOY: ${{ needs.deploy.result }}
          URL: ${{ needs.deploy.outputs.url }}
          VERSION: ${{ needs.deploy.outputs.version }}
          PREVIOUS: ${{ needs.deploy.outputs.previous_version }}
          ROLLBACK: ${{ needs.deploy.outputs.rollback }}
          SITE_URL: ${{ needs.deploy.outputs.site_url }}
          SITE_SMOKE: ${{ needs.deploy.outputs.site_smoke }}
          NONE: ${{ needs.deploy.outputs.none }}
          LIVE_AS: On `main`, ships in the next release
        run: node runtime/scripts/deploy-comment.mjs report
