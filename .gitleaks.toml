# Secret-scanning config for gitleaks, used by CI (.github/workflows/ci.yml).
# Starts from gitleaks' built-in rules. v1's config had no [extend] and so ran zero rules (F-SEC-20).
# Proven by tests/gitleaks.test.sh, which plants fake secrets. Add an allowlist only for a reviewed
# false positive, and keep the test green.
title = "devshop secret scan"

[extend]
useDefault = true
