# What: Two-container compose for compose isolation.
# Why:  workspace (dev container) has no docker access; supabase-runner
#       holds the docker socket and runs the local Supabase stack as a
#       sibling-container fan-out. RPC relay on :9000 lets the workspace
#       drive supabase commands without needing the socket.
#
# Required env at compose-up time:
#   LOCAL_WORKSPACE_FOLDER  host-side absolute path to the project root
#       (i.e. the parent of this .devcontainer/ dir). Auto-written into
#       .devcontainer/.env by .devcontainer/init-host-env.sh, which the
#       VS Code Dev Containers extension runs before compose-up via the
#       initializeCommand in devcontainer.json. For manual `docker
#       compose up` runs from a host terminal, run init-host-env.sh
#       once first or `export LOCAL_WORKSPACE_FOLDER=$(pwd)`.
#
# Why the runner uses a host-path-mirrored bind:
#   `supabase start` (inside the runner) tells the HOST docker engine to
#   bind-mount the function source into a sibling edge-runtime container.
#   The host engine resolves the bind path on its OWN filesystem, not the
#   runner's. So the runner's source path MUST equal the host path. The
#   ${LOCAL_WORKSPACE_FOLDER}/supabase:${LOCAL_WORKSPACE_FOLDER}/supabase
#   shape produces that mirroring. Without it, the function container
#   start fails with "no such file or directory" on the bind path.
#
# Why supabase-runner does NOT forward the supabase ports to the host:
#   `supabase start` spawns sibling containers (supabase_kong_*,
#   supabase_db_*, ...) on the HOST docker engine — outside this compose
#   project. Those siblings bind the API port (REST/kong, default 54321)
#   and DB port (Postgres, default 54322) to the host themselves. If
#   supabase-runner ALSO declared `ports: ["54321:54321"]`, the host port
#   allocation conflicts and `supabase start` fails with "Bind for
#   0.0.0.0:54322 failed: port is already allocated". Workspace + macOS
#   browser reach the supabase data plane via host.docker.internal on
#   those same ports (Docker Desktop maps host.docker.internal to the
#   host gateway from any container, and the operator adds
#   `127.0.0.1 host.docker.internal` to macOS /etc/hosts so the browser
#   resolves it too — see template README § Operator setup, and project
#   CLAUDE.md § Gotchas after scaffold).
#
#   Per-project port override: all 5 Supabase ports (API, DB, Studio,
#   Mailpit, Analytics) are derived from supabase/config.toml into
#   .devcontainer/.env by derive-ports-from-config.sh on every container
#   start. compose.yml, init-firewall.sh, preship scripts, and the
#   supabase-runner's socat tunnels all read from the same env vars, so
#   config.toml is the single source of truth. Needed when multiple
#   projects' local stacks run side-by-side on the same host (e.g.
#   home-os uses +100 offset to avoid colliding with lalista).
#   Only port 9000 (the cmd-relay) belongs to this compose project, and
#   it stays as compose-internal (workspace reaches it via DNS as
#   `supabase-runner:9000`); no host forwarding is needed.
#
# Why the runner's `command` runs socat tunnels first:
#   `supabase start` (inside the runner) hardcodes `127.0.0.1` for its
#   own healthcheck connections to the spawned db / kong containers,
#   but those containers are siblings on the HOST docker engine — their
#   ports are bound to the host, NOT to the runner's loopback. Without
#   forwarding, the healthcheck fails with "dial tcp 127.0.0.1:<db port>:
#   connect: connection refused" and supabase tears the stack down.
#   The two `socat` lines forward 127.0.0.1:<api> / :<db> inside the
#   runner to host.docker.internal:<api> / :<db> (where the spawned
#   siblings' host-bound ports actually live). socat's lazy-connect
#   behavior + supabase's healthcheck retry loop handle the brief
#   window where the spawned db isn't yet up — by the time supabase's
#   second healthcheck attempt runs, db is listening and the forward
#   succeeds. socat keeps running for the lifetime of the runner so
#   later `pnpm db:reset` etc. (issued via the relay) hit healthy
#   forwards too.
#
# Why supabase-runner has stop_grace_period: 30s:
#   On `docker compose stop` (what VS Code Dev Containers runs when you
#   close the window or Stop Container), tini forwards SIGTERM to the
#   cmd-relay node process. The relay traps SIGTERM and runs
#   `supabase stop` before exiting, so the spawned supabase_* sibling
#   containers on the host engine go down with the devcontainer instead
#   of orphan-running forever. `supabase stop` typically takes 5-15s to
#   stop ~10 sibling containers; the default 10s grace_period would
#   SIGKILL us mid-teardown. 30s leaves comfortable headroom + 5s slack
#   that the relay's own 25s budget timer uses to force-exit cleanly.
#   See supabase-runner/cmd-relay.mjs § Shutdown.
#
# Persistence model: data volumes live on the host docker engine and
# survive `docker compose stop` (the relay's `supabase stop` only stops
# containers; volumes are preserved). To wipe local state, exec into the
# runner and run `supabase stop --no-backup` (wipes data, keeps config)
# or `supabase stop --all` (wipes everything). `docker compose down -v`
# here only removes THIS compose's volumes (none currently) — it does
# NOT touch the sibling supabase_* containers' host-managed volumes.

services:
  workspace:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TZ: ${TZ:-America/Los_Angeles}
        CLAUDE_CODE_VERSION: latest
        GIT_DELTA_VERSION: 0.19.2
        SUPABASE_CLI_VERSION: ${SUPABASE_CLI_VERSION:-2.84.2}
        DCG_VERSION: 0.4.0
        GITLEAKS_VERSION: 8.30.1
    cap_add:
      - NET_ADMIN
      - NET_RAW
    env_file:
      - .env
    environment:
      # Auto-set by compose so workspace processes (integration tests,
      # ad-hoc supabase-js scripts, seed scripts) reach the local stack
      # without a manual env prefix. Local-stack JWTs are the published
      # supabase-demo defaults (same string across every Supabase install)
      # — safe to commit. Prod values live on a separate surface (Vercel
      # for NEXT_PUBLIC_*, never on this devcontainer's local-dev surface).
      SUPABASE_URL: http://host.docker.internal:${SUPABASE_API_PORT:?required from .devcontainer/.env}
      SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
      CONTAINER: '1'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ..:/workspace:cached
    networks:
      - supabase-net
    depends_on:
      - supabase-runner
    command: ['sleep', 'infinity']

  supabase-runner:
    build:
      context: ./supabase-runner
      dockerfile: Dockerfile
      args:
        SUPABASE_CLI_VERSION: ${SUPABASE_CLI_VERSION:-2.84.2}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ${LOCAL_WORKSPACE_FOLDER}/supabase:${LOCAL_WORKSPACE_FOLDER}/supabase
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - supabase-net
    working_dir: ${LOCAL_WORKSPACE_FOLDER}/supabase
    # 30s: cmd-relay traps SIGTERM and runs `supabase stop` before exit.
    # See header comment block § Why supabase-runner has stop_grace_period.
    stop_grace_period: 30s
    command:
      - sh
      - -c
      - |
        socat -d TCP-LISTEN:${SUPABASE_API_PORT:?required from .devcontainer/.env},fork,reuseaddr,bind=127.0.0.1 TCP:host.docker.internal:${SUPABASE_API_PORT:?required from .devcontainer/.env} &
        socat -d TCP-LISTEN:${SUPABASE_DB_PORT:?required from .devcontainer/.env},fork,reuseaddr,bind=127.0.0.1 TCP:host.docker.internal:${SUPABASE_DB_PORT:?required from .devcontainer/.env} &
        sleep 0.5
        supabase start
        exec /usr/local/bin/cmd-relay.mjs

networks:
  supabase-net:
