name: Keepalive
on:
  schedule:
    - cron: '0 9 * * 1' # Every Monday at 9am UTC
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping production
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ vars.PRODUCTION_URL }}")
          if [ "$STATUS" != "200" ]; then
            echo "::warning::Production returned $STATUS"
          fi
