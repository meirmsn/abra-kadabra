name: Keepalive
on:
  schedule:
    - cron: '0 9 * * 1,4' # Every Monday and Thursday at 9am UTC
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping production
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ vars.PRODUCTION_URL }}")
          if [ "$STATUS" != "200" ]; then
            echo "::warning::Production returned $STATUS"
          fi
      - name: Ping Supabase
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ vars.SUPABASE_PROD_URL }}/rest/v1/" -H "apikey: ${{ vars.SUPABASE_PROD_ANON_KEY }}")
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "::warning::Supabase returned $STATUS"
          fi
